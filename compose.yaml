services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-ollama}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.dek.io.vn/v1/}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-local}
      RERANK_URL: ${RERANK_URL:-https://api.dek.io.vn/rerank}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      QDRANT_URL: ${QDRANT_CLOUD_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_CLOUD_API_KEY:-}
      QDRANT_PATH: ""
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-false}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-true}
      LANGFUSE_TRACING_ENVIRONMENT: docker
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./index/bm25_index.pkl
        target: /app/index/bm25_index.pkl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/utils/stopwords.txt
        target: /app/data/utils/stopwords.txt
        read_only: true
        bind:
          create_host_path: false
      - model-cache:/home/app/.cache/huggingface
      - document-cache:/home/app/.cache/docling
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=10)"]
      interval: 30s
      timeout: 15s
      start_period: 10m
      retries: 3
    stop_grace_period: 11m

  ui:
    build:
      context: .
      target: ui
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_ANALYTICS_ENABLED: "false"
      GRADIO_SHARE: ${GRADIO_SHARE:-false}
      DEMO_USERNAME: ${DEMO_USERNAME:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "127.0.0.1:${UI_PORT:-7860}:7860"
    depends_on:
      api:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./index/qdrant-server:/qdrant/storage

volumes:
  model-cache:
  document-cache:
